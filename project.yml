name: RemoteCamera

options:
  bundleIdPrefix: com.ryosukecla
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: 9855P85M5T
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

targets:
  # One target, two apps. The iPhone build is the camera and the Mac build is the remote control;
  # which one you get is decided by `#if os(...)` in the sources (see App/RemoteCameraApp.swift).
  RemoteCamera:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: RemoteCamera
        excludes:
          - "**/.DS_Store"
          - Info.plist
    info:
      # Generated by `make gen` from the properties below; not checked in.
      path: RemoteCamera/Info.plist
      properties:
        CFBundleDisplayName: Remote Camera
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.photography
        # iOS only; ignored by the Mac build.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # The phone's UI stays portrait. Captured photos and videos still come out upright in any
        # orientation: the rotation comes from AVCaptureDevice.RotationCoordinator, not from the UI.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: >-
          Remote Camera shows this camera to the Mac you connect, and takes the
          photos and videos it asks for.
        NSMicrophoneUsageDescription: >-
          Remote Camera records sound with your videos and lets the connected
          Mac listen in.
        NSPhotoLibraryAddUsageDescription: >-
          Photos and videos taken from the Mac are saved to your photo library.
        # Both apps: the iPhone advertises itself, the Mac browses for it.
        NSLocalNetworkUsageDescription: >-
          Remote Camera connects your Mac and your iPhone over the local network.
        NSBonjourServices:
          - _remotecam._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryosukecla.remotecamera
        PRODUCT_NAME: RemoteCamera
        # iPhone only. xcodegen gives every iOS application target "1,2", which beats a
        # project-level value, so this has to sit on the target.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
